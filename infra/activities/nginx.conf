# Independent static server: no proxy, application runtime, credentials or uploads.
worker_processes 1;
pid /run/scryproof-activities/nginx.pid;
error_log /run/scryproof-activities/error.log warn;
events { worker_connections 64; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log off;
    server_tokens off;
    sendfile on;
    client_body_temp_path /run/scryproof-activities/body;
    proxy_temp_path /run/scryproof-activities/proxy;
    fastcgi_temp_path /run/scryproof-activities/fastcgi;
    uwsgi_temp_path /run/scryproof-activities/uwsgi;
    scgi_temp_path /run/scryproof-activities/scgi;
    map $uri $activities_cache {
        default "no-cache";
        ~^/releases/ "public, max-age=31536000, immutable";
    }
    server {
        listen unix:/run/scryproof-activities/nginx.sock;
        root /srv/sites/scryproof-activities/current;
        index index.html;
        autoindex off;
        disable_symlinks on from=/srv/sites/scryproof-activities/current;
        add_header Content-Security-Policy "sandbox allow-scripts allow-same-origin allow-pointer-lock; default-src 'none'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob:; connect-src 'self'; worker-src 'self' blob:; font-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors https://scryproof.com app://scryproof" always;
        add_header Permissions-Policy "camera=(), microphone=(), display-capture=(), geolocation=(), payment=()" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        add_header Cross-Origin-Resource-Policy same-origin always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        # Every URL stays stable for Godot's IndexedDB save path. A revalidated
        # loader always fetches the current export; old engines are never mixed.
        add_header Cache-Control $activities_cache always;
        location = /health { return 200 "activities ok\n"; }
        location ~ ^/drain-the-swamp/(?:[A-Za-z0-9_.-]+\.(?:html|js|css|wasm|pck|png|json))?$ {
            limit_except GET { deny all; }
            try_files $uri $uri/index.html =404;
        }
        location ~ "^/releases/[a-f0-9]{12}-[a-f0-9]{12}/drain-the-swamp/[A-Za-z0-9_.-]+\.(html|js|css|wasm|pck|png|json)$" {
            root /srv/sites/scryproof-activities;
            disable_symlinks on;
            limit_except GET { deny all; }
            try_files $uri =404;
        }
        location ^~ /hero-line/ {
            alias /srv/sites/scryproof-activities/hero-line/current/;
            disable_symlinks on from=/srv/sites/scryproof-activities/hero-line/current;
            limit_except GET { deny all; }
            try_files $uri $uri/index.html =404;
        }
        location / { return 404; }
    }
}
