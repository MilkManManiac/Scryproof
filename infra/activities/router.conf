# Dedicated hostname on the same box. Never route game URLs through Scryproof.
limit_conn_zone $binary_remote_addr zone=scryproof_activities_ip:1m;
limit_conn_zone $server_name zone=scryproof_activities_total:1m;
limit_req_zone $binary_remote_addr zone=scryproof_activities_requests:1m rate=10r/s;
server {
    listen 80;
    listen [::]:80;
    server_name activities.scryproof.com;
    access_log off;
    location ^~ /.well-known/acme-challenge/ { root /var/www/scryproof-activities; try_files $uri =404; }
    location / { return 301 https://activities.scryproof.com$request_uri; }
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name activities.scryproof.com;
    access_log off;
    ssl_certificate /etc/letsencrypt/live/activities.scryproof.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/activities.scryproof.com/privkey.pem;
    limit_conn scryproof_activities_ip 4;
    limit_conn scryproof_activities_total 24;
    limit_req zone=scryproof_activities_requests burst=30 nodelay;
    limit_req_status 429;
    limit_conn_status 429;
    # A download cannot consume the whole box's uplink. Godot executes locally.
    limit_rate 2m;
    client_max_body_size 1k;
    # Hero Line multiplayer: a websocket to the relay's unix socket (hero-line-relay.service). Long-lived, so its own read timeout.
    location = /hero-line/ws {
        proxy_pass http://unix:/run/hero-line-relay/relay.sock;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host activities.scryproof.com;
        proxy_set_header Cookie "";
        proxy_set_header Authorization "";
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
    location / {
        proxy_pass http://unix:/run/scryproof-activities/nginx.sock;
        proxy_set_header Host activities.scryproof.com;
        proxy_set_header Cookie "";
        proxy_set_header Authorization "";
        proxy_hide_header Set-Cookie;
        proxy_buffering off;
        proxy_read_timeout 120s;
    }
}
